<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- Base title (T-0244). AppTitleStrategy rewrites this per route as
             "<Page> | Lords Regiment" and restores this exact string on any route
             that does not name itself, so the two must stay in step. -->
        <title>Lords Regiment</title>
        <meta
            name="description"
            content="Discipline, honour, and the line. A Holdfast: Nations at War regiment of standing."
        />

        <!-- Social card + canonical: DEFAULTS ONLY (T-0287). Three writers touch
             these tags and the overlap is deliberate, not duplication to clean up:

             1. SeoService rewrites every one of them on each route (and REMOVES
                og:image on a page that has none, dropping twitter:card back to
                `summary`). It owns the live document.
             2. Crawlers and unfurlers never get this file at all — Caddy matches
                their User-Agent and rewrites /u/*, /roster* and /gallery/* to the
                API's server-rendered shells, because no unfurler runs JavaScript.
                That shell is what search engines actually index.
             3. What is left for these tags is the pre-boot window a human's
                browser sees, and any route that never calls SeoService.

             Delete them and a cold share of "/" unfurls with no card at all.

             The attribute matters: og:* must use `property` and twitter:* must use
             `name`, because that is the selector Angular's Meta service matches on
             — swap one and SeoService appends a second tag instead of updating
             this one. URLs are absolute against the production origin on purpose:
             an unfurler cannot resolve a relative one, and nothing unfurls a dev
             build. -->
        <meta property="og:site_name" content="Lords Regiment" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Lords Regiment" />
        <meta
            property="og:description"
            content="Discipline, honour, and the line. A Holdfast: Nations at War regiment of standing."
        />
        <!-- The crest, not a screenshot (T-0311). `/` is the URL every external
             link points at and the one path the crawler matcher deliberately
             skips, so THIS tag is what Discord unfurls for the site itself. It
             pointed at banner.png — a frame of Holdfast gameplay that says
             nothing about which regiment is being shared. social-card.png is
             1200x630 of the regiment crest on `--ink-900`, the size every
             unfurler wants for the wide card. Kept in step with `DEFAULT_IMAGE`
             in core/services/seo.service.ts and `DEFAULT_CARD_IMAGE` in the
             API's seo.service.ts, which is why this one is a coupled deploy. -->
        <meta
            property="og:image"
            content="https://lordsofholdfast.com/assets/images/social-card.png"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Lords Regiment" />
        <meta
            name="twitter:description"
            content="Discipline, honour, and the line. A Holdfast: Nations at War regiment of standing."
        />
        <!-- `/home`, not `/` (T-0297). This is the ONE tag in this block that a
             search engine acts on before SeoService boots, and it used to point
             at `/` while the sitemap, every shell and SeoService itself all
             declared `/home` canonical. `/` is deliberately outside the crawler
             matcher (a Cloudflare Cache Rule covers it and Cloudflare ignores
             `Vary: User-Agent`), so a non-JS crawler landing on the root — which
             is where every external inbound link points — got an empty
             <app-root> self-canonicalising to a URL nothing else agreed with.
             Naming the redirect target here passes that equity onward instead of
             stranding it. -->
        <link rel="canonical" href="https://lordsofholdfast.com/home" />

        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0b0e14" />
        <!-- Icons (T-0243). All files live in `public/`, which angular.json copies
             to the dist root — that is why these hrefs are unprefixed. The .ico
             carries 48/32/16 frames, so the `sizes` list is not a guess.

             There is deliberately NO `rel="icon" type="image/svg+xml"` here (T-0259).
             The favicon.svg RealFaviconGenerator emitted was not vector art: it was a
             75x75 raster (byte-identical to assets/images/regiment-logo-sm.png) wrapped
             in a single <image> tag, i.e. LOWER resolution than the 96px PNG below —
             and Chrome prefers an SVG icon over any PNG, so it won every larger surface
             (bookmarks, history, the tab switcher, install prompts). No genuine vector
             of the crest exists in this repo, so the link and the file were dropped and
             Chrome now falls back to favicon-96x96.png. Do not re-add an SVG icon
             unless it is real path data of the laurel-wreath crest. -->
        <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
        <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
        <!-- manifest.json, not site.webmanifest: nginx's stock mime.types has no
             `webmanifest` entry, so that name would be served as
             application/octet-stream. `.json` is mapped, and nginx.conf lives in
             this repo but the SPA should not need a server change to be correct. -->
        <link rel="manifest" href="manifest.json" />

        <!-- Web fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        />
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
