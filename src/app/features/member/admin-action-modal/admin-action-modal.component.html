<div *ngIf="isOpen" class="modal-backdrop" (click)="cancel()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="panel-header between">
      <span class="panel-title">{{ title }}</span>
      <button class="btn btn-icon btn-ghost btn-sm" (click)="cancel()">✕</button>
    </div>
    <div class="panel-body">
      <p style="font-size:14px;color:var(--t-300);margin:0 0 24px;line-height:1.6">{{ message }}</p>
      <div class="row" style="gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost btn-sm" (click)="cancel()">Cancel</button>
        <button class="btn btn-sm" [ngClass]="confirmClass" (click)="confirm()">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
</div>
