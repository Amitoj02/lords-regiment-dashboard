<nav class="public-nav" [class.menu-open]="menuOpen">
    <div class="row public-nav-brand gap-12">
        <img
            src="assets/images/regiment-logo.png"
            width="34"
            height="34"
            alt="Regiment Crest"
            class="public-nav-logo"
        />
        <div>
            <div class="serif public-nav-title">Lord Regiment</div>
            <div class="admin-label public-nav-subtitle">Holdfast · Nations at War</div>
        </div>
    </div>

    <!-- Also the mobile drawer: everything below collapses behind the burger. -->
    <div class="public-nav-links">
        @for (link of navLinks; track link.path) {
        <!-- The highlight comes from the router (T-0287). It used to be an
             @Input each page set by hand, which the layout route has nobody
             left to set. -->
        <a
            class="nav-link"
            [routerLink]="link.path"
            routerLinkActive="nav-link--active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            (click)="closeMenu()"
            >{{ link.label }}</a
        >
        }

        <div class="public-nav-cta">
            @if (auth.isAuthenticated()) {
            <!-- Staff only. `/app` is behind staffGuard now, so offering this to
                 an ordinary member would be a button that bounces them. -->
            @if (auth.isStaff()) {
            <a routerLink="/app" class="btn btn-primary" (click)="closeMenu()">Dashboard</a>
            } @if (auth.isMember()) {
            <!-- Demoted to secondary only when it sits beside Dashboard, so a
                 plain member's single destination is not a muted button. -->
            <a
                [routerLink]="auth.myProfilePath()"
                class="btn"
                [class.btn-primary]="!auth.isStaff()"
                [class.btn-secondary]="auth.isStaff()"
                (click)="closeMenu()"
                >My profile</a
            >
            } @else {
            <a routerLink="/onboarding/status" class="btn btn-primary" (click)="closeMenu()"
                >My Application</a
            >
            }
            <button type="button" class="btn btn-ghost" (click)="signOut()">Sign out</button>
            } @else {
            <!-- Hidden entirely when no invite is configured (T-0234). -->
            @if (discordInviteUrl) {
            <a
                [href]="discordInviteUrl"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-ghost public-nav-discord"
                (click)="closeMenu()"
                >Join Discord</a
            >
            }
            <a routerLink="/login" class="btn btn-discord" (click)="closeMenu()">Sign in</a>
            }
        </div>
    </div>

    <!-- Mobile menu toggle -->
    <button type="button" class="public-nav-burger" (click)="toggleMenu()" aria-label="Toggle menu">
        @if (!menuOpen) {
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        } @if (menuOpen) {
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        }
    </button>
</nav>
