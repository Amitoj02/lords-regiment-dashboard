<nav class="public-nav" [class.menu-open]="menuOpen">
    <div class="row public-nav-brand gap-12">
        <img
            src="assets/images/regiment-logo.png"
            width="34"
            height="34"
            alt="Regiment Crest"
            class="public-nav-logo"
        />
        <div>
            <div class="serif public-nav-title">Lord Regiment</div>
            <div class="admin-label public-nav-subtitle">Holdfast · Nations at War</div>
        </div>
    </div>

    <div class="public-nav-links">
        @for (link of navLinks; track link) {
        <a
            [routerLink]="link.path"
            (click)="closeMenu()"
            [ngClass]="{ 'nav-link': true, 'nav-link--active': activeLink === link.path }"
            >{{ link.label }}</a
        >
        }

        <div class="public-nav-cta">
            @if (auth.isAuthenticated()) { @if (auth.isMember()) {
            <a routerLink="/app/dashboard" class="btn btn-primary" (click)="closeMenu()"
                >Dashboard</a
            >
            } @else {
            <a routerLink="/onboarding/status" class="btn btn-primary" (click)="closeMenu()"
                >My Application</a
            >
            }
            <button type="button" class="btn btn-ghost" (click)="signOut()">Sign out</button>
            } @else {
            <!-- Hidden entirely when no invite is configured (T-0234). -->
            @if (discordInviteUrl) {
            <a
                [href]="discordInviteUrl"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-ghost public-nav-discord"
                (click)="closeMenu()"
                >Join Discord</a
            >
            }
            <a routerLink="/login" class="btn btn-discord" (click)="closeMenu()">Sign in</a>
            }
        </div>
    </div>

    <!-- Mobile menu toggle -->
    <button type="button" class="public-nav-burger" (click)="toggleMenu()" aria-label="Toggle menu">
        @if (!menuOpen) {
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        } @if (menuOpen) {
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        }
    </button>
</nav>
