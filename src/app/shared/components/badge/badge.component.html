<span
    class="badge"
    [class.brass]="variant === 'brass'"
    [class.laurel]="variant === 'laurel'"
    [class.ox]="variant === 'ox'"
    [class.blue]="variant === 'blue'"
    [class.parch]="variant === 'parch'"
    [class.solid]="variant === 'solid'"
    [class.dot]="dot"
    >{{ text }}<ng-content></ng-content
></span>
