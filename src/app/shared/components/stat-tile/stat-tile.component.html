<div class="stat-tile">
  <div
    class="stat-accent-bar"
    *ngIf="accent"
    [style.background]="accent"
  ></div>
  <div class="admin-label stat-label">{{ label }}</div>
  <div class="stat-value" [style.color]="accent || null">{{ value }}</div>
  <div class="stat-foot" *ngIf="foot">{{ foot }}</div>
</div>
