<div class="stat-tile" [style.--stat-accent]="accent || null">
    @if (accent) {
    <div class="stat-accent-bar"></div>
    }
    <div class="admin-label stat-label">{{ label }}</div>
    <div class="stat-value">{{ value }}</div>
    @if (foot) {
    <div class="stat-foot">{{ foot }}</div>
    }
</div>
