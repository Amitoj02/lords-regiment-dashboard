<span class="platform-badges">
  <span
    *ngFor="let p of activePlatforms"
    class="platform-badge"
    [attr.title]="p.label"
    [style.background]="p.color"
  >
    <!-- Steam -->
    <svg *ngIf="p.key === 'steam'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

    </svg>
    <!-- Xbox -->
    <svg *ngIf="p.key === 'xbox'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M4.102 5.476C5.875 3.584 8.319 2.348 11.04 2.07c-1.167.988-3.038 2.927-4.805 5.538-1.005 1.498-2.143 3.617-2.822 5.714-.264-.665-.41-1.385-.41-2.14 0-2.038.82-3.885 2.099-5.246zM12 4.292c2.15-2.152 4.02-3.056 4.02-3.056a9.98 9.98 0 0 0-4.02-.861c-1.413 0-2.748.294-3.96.82 0 0 1.816.892 3.96 3.097zM19.898 5.476C18.125 3.584 15.681 2.348 12.96 2.07c1.167.988 3.038 2.927 4.805 5.538 1.005 1.498 2.143 3.617 2.822 5.714.264-.665.41-1.385.41-2.14 0-2.038-.82-3.885-2.099-5.246zM4.26 14.39c.527 2.004 1.698 3.753 3.27 5.025 1.55 1.257 3.51 2.013 5.645 2.013 2.133 0 4.094-.756 5.643-2.011 1.572-1.272 2.745-3.022 3.27-5.025-.677 2.059-2.074 4.285-4.297 6.303l-.007.006C16.58 21.753 14.385 22.375 12 22.375s-4.58-.622-5.784-1.676l-.007-.006c-2.222-2.018-3.62-4.244-4.296-6.303h.347z"/>

    <!-- PlayStation -->
    <svg *ngIf="p.key === 'ps'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M8.984 2.596v16.71l3.984 1.218V6.354c0-.808.35-1.362 1.114-.857.498.34.712.805.712 1.613v5.518c2.144.992 4.678-.084 4.678-3.617V7.436c-.034-3.12-2.124-4.808-5.19-4.84-.702 0-3.424.356-5.298 0zm-1.984 15.02c-2.04-.706-3-1.844-3-3.25 0-1.45.944-2.444 2.854-2.988l4.13-1.22v2.178l-2.97.848c-.708.202-.984.568-.984 1.05 0 .556.38.994 1.228 1.34l2.726.972v2.288l-3.984-1.218z"/>
