<header class="topbar">
    <!-- Mobile hamburger — opens the sidebar drawer -->
    <button type="button" class="topbar-burger" (click)="menu.emit()" aria-label="Open menu">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
    </button>

    <!-- Mobile brand (T-0083): the sidebar (which normally shows the brand) is an
         off-canvas drawer on mobile, so surface the regiment mark here. -->
    <a routerLink="/home" class="topbar-brand" aria-label="Lords Regiment — home">
        <img src="/assets/images/regiment-logo-sm.png" alt="" class="topbar-brand-logo" />
        <span class="topbar-brand-name">Lords Regiment</span>
    </a>

    <!-- Breadcrumbs -->
    <nav class="crumbs" aria-label="Breadcrumb">
        @for (crumb of crumbPairs; track crumb; let first = $first) { @if (!first) {
        <span class="sep" aria-hidden="true">/</span>
        }
        <span [class.here]="crumb.isLast">{{ crumb.label }}</span>
        }
    </nav>

    <span class="sp"></span>

    <!-- Back to home (T-0082 — replaced the decorative search box; T-0128 → public
         landing). `/home`, not `/`: the root route redirects there, so `/` would
         cost a redirect hop on every click. -->
    <a routerLink="/home" class="btn btn-ghost btn-sm topbar-home">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span class="topbar-home-label">Home</span>
    </a>

    <!-- Projected action buttons -->
    <ng-content select="[topbar-actions]"></ng-content>
</header>
