<header class="topbar">
  <!-- Breadcrumbs -->
  <nav class="crumbs" aria-label="Breadcrumb">
    <ng-container *ngFor="let crumb of crumbPairs; let first = first">
      <span class="sep" *ngIf="!first" aria-hidden="true">/</span>
      <span [class.here]="crumb.isLast">{{ crumb.label }}</span>
    </ng-container>
  </nav>

  <span class="sp"></span>

  <!-- Search -->
  <div class="topbar-search" *ngIf="showSearch">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" placeholder="Search…" class="topbar-input" />
  </div>

  <!-- Projected action buttons -->
  <ng-content select="[topbar-actions]"></ng-content>
</header>
