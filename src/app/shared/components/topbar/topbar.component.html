<header class="topbar">
    <!-- Mobile hamburger — opens the sidebar drawer -->
    <button type="button" class="topbar-burger" (click)="menu.emit()" aria-label="Open menu">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
    </button>

    <!-- Breadcrumbs -->
    <nav class="crumbs" aria-label="Breadcrumb">
        @for (crumb of crumbPairs; track crumb; let first = $first) { @if (!first) {
        <span class="sep" aria-hidden="true">/</span>
        }
        <span [class.here]="crumb.isLast">{{ crumb.label }}</span>
        }
    </nav>

    <span class="sp"></span>

    <!-- Search -->
    @if (showSearch) {
    <div class="topbar-search">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="search" placeholder="Search…" class="topbar-input" />
    </div>
    }

    <!-- Projected action buttons -->
    <ng-content select="[topbar-actions]"></ng-content>
</header>
