@if (linkToDetail) {
<a class="gallery-card" [routerLink]="['/gallery', item.id]">
    <ng-container *ngTemplateOutlet="cardInner"></ng-container>
</a>
} @else {
<div class="gallery-card">
    <ng-container *ngTemplateOutlet="cardInner"></ng-container>
</div>
}

<ng-template #cardInner>
    <!-- Media preview (resolved from mediaUrl via MediaEmbedService) -->
    <div class="gallery-card-thumb" [ngClass]="aspectClass">
        @if (preview?.kind === 'image') {
        <img [src]="preview!.rawUrl" [alt]="item.title" class="gallery-card-img" />
        } @else if (posterSrc && !posterFailed) {
        <!-- Poster beats the clip: a still <img> is the only preview iOS Safari paints. -->
        <img
            [src]="posterSrc"
            [alt]="item.title"
            class="gallery-card-img"
            (error)="posterFailed = true"
        />
        } @else if (preview?.kind === 'video' && !videoFailed) {
        <video
            [src]="preview!.rawUrl"
            class="gallery-card-img"
            preload="metadata"
            muted
            playsinline
            (error)="videoFailed = true"
        ></video>
        } @else {
        <div class="gallery-card-placeholder"></div>
        } @if (showPlay) {
        <div class="gallery-play-overlay">
            <div class="gallery-play-btn">
                <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor">
                    <path d="M0 0l12 7-12 7V0z" />
                </svg>
            </div>
        </div>
        } @if (showLinkBadge) {
        <div class="gallery-link-badge">
            <span class="badge brass gallery-vod-badge">
                <svg
                    width="11"
                    height="11"
                    viewBox="0 0 16 16"
                    fill="currentColor"
                    class="gallery-vod-icon"
                >
                    <path
                        d="M7.5 3.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 1 0V4a.5.5 0 0 0-.5-.5zM2 8a6 6 0 1 1 12 0A6 6 0 0 1 2 8zm1 0a5 5 0 1 0 10 0A5 5 0 0 0 3 8z"
                    />
                </svg>
                VOD
            </span>
        </div>
        }
    </div>
    <!-- Card body -->
    <div class="gallery-card-body">
        <div class="gallery-card-title serif-display">{{ item.title }}</div>
        <div class="row gallery-card-meta">
            <div class="row gallery-submitter">
                <hf-avatar
                    [name]="item.submittedBy"
                    [avatarUrl]="item.submittedByAvatarUrl"
                    [size]="18"
                ></hf-avatar>
                <span class="gallery-submitter-name">{{ item.submittedBy }}</span>
            </div>
        </div>
    </div>
</ng-template>
