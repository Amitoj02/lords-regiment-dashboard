<div class="appshell" [class.drawer-open]="drawerOpen">
    <!-- Mobile drawer backdrop (tap to dismiss) -->
    <div class="drawer-backdrop" (click)="closeDrawer()" aria-hidden="true"></div>

    <!-- Sidebar — becomes an off-canvas drawer on mobile -->
    <hf-sidebar
        [active]="activeRoute"
        [user]="navUser"
        [isAdmin]="isAdmin()"
        [capabilities]="capabilities()"
        (navigate)="onNavigate($event)"
        (logout)="onLogout()"
    ></hf-sidebar>

    <!-- Main content area -->
    <div class="appmain">
        <!-- Topbar -->
        <hf-topbar [crumbs]="crumbs" (menu)="toggleDrawer()">
            <ng-content select="[topActions]" topbar-actions></ng-content>
        </hf-topbar>

        <!-- Page scroll area -->
        <div class="appscroll">
            <div class="page">
                <!-- Optional page heading -->
                @if (title) {
                <div class="page-head">
                    <h1 class="page-title">{{ title }}</h1>
                    <div class="page-head-actions">
                        <ng-content select="[pageActions]"></ng-content>
                    </div>
                </div>
                }

                <!-- Page body -->
                <ng-content></ng-content>
            </div>

            <!-- In-shell legal links (T-0126) — same public legal routes -->
            <footer class="appshell-footer">
                <a routerLink="/terms">Terms</a>
                <span class="appshell-footer-sep">·</span>
                <a routerLink="/privacy">Privacy</a>
                <span class="appshell-footer-sep">·</span>
                <a routerLink="/guidelines">Community Guidelines</a>
            </footer>
        </div>

        <!-- Mobile bottom navigation -->
        <hf-bottom-nav [active]="activeRoute" (navigate)="onNavigate($event)"></hf-bottom-nav>
    </div>
</div>
