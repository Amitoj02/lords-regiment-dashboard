# Serves the Angular SPA and reverse-proxies /api to the api container, so the
# browser is same-origin with the API (no CORS). Used by the prod stage.
#
# Caddy at the edge is the authoritative source of TLS + security headers + CSP.
# The headers below are DEFENSE IN DEPTH (LDA-L12): they harden the case where
# this nginx is reached directly, and they stop deep-linked SPA routes from
# serving a heuristically-cached index.html.

# ── CRAWLER + UNFURLER ROUTING (T-0299) ──────────────────────────────────────
#
# Same intent as the `@crawler` block in the API repo's Caddyfile, and
# deliberately duplicated rather than left to it. The reason is a deployment
# fact, not a design preference:
#
#   `lords-deploy` — the SSH forced command CI is restricted to — can only pin
#   image tags and pull. It has never synced the Caddyfile, so every crawler
#   block written there needed a human to SSH in and scp it. That step was
#   documented, and it did not happen: production ran a Caddyfile predating even
#   the T-0197 gallery unfurler, so every link pasted into Discord unfurled as
#   the same generic site card while the API served correct server-rendered HTML
#   that nothing ever asked for.
#
# This file ships INSIDE the web image. It reaches production on the next
# ordinary `deploy web <tag>`, with no SSH step and nothing to forget.
#
# ── THE TWO LAYERS CANNOT CONFLICT ───────────────────────────────────────────
# Caddy's `handle` blocks are mutually exclusive and evaluated in file order, so
# a synced Caddyfile intercepts a crawler at the edge and this nginx never sees
# the request. An un-synced one falls through to `web:80` and this handles it.
# Whichever is live answers, and both produce identical bytes, because both
# proxy the same path to the same API.
#
# ⚠️ Keep the UA list in step with the Caddyfile's. `Google-InspectionTool` is
# here on purpose and is absent from Caddy's: without it, Search Console's URL
# Inspection fetches the empty Angular shell and reports the page as having no
# content — the one tool you would reach for to debug this, returning a false
# negative.
map $http_user_agent $lords_is_crawler {
    default 0;
    "~*(discordbot|facebookexternalhit|twitterbot|whatsapp|slackbot|telegrambot|linkedinbot|redditbot|skypeuripreview|iframely|embedly|googlebot|google-inspectiontool|storebot-google|bingbot|applebot|duckduckbot|yandexbot|mastodon|matrix|signal)" 1;
}

# Only the paths that have a route under /api/seo/*. A path listed here without
# one returns a JSON 404, which an unfurler renders as a BROKEN preview rather
# than as no preview — strictly worse than doing nothing.
#
# ⚠️ `/` IS DELIBERATELY ABSENT and `/home` stands in for it. They render the
# same landing component, but `/` is the one path a Cloudflare Cache Rule
# covers, and Cloudflare honours `Vary` for `Accept-Encoding` and nothing else —
# so a UA-varying `/` eventually puts the crawler document in the edge cache and
# serves it to every human who opens the front page. `/home` is what `/`
# redirects to and what both surfaces declare canonical, so nothing is lost.
map $uri $lords_crawlable {
    default 0;
    "~^/home$" 1;
    "~^/roster$" 1;
    "~^/roster/" 1;
    "~^/u/." 1;
    "~^/events$" 1;
    "~^/events/" 1;
    "~^/gallery$" 1;
    "~^/gallery/" 1;
}

# nginx has no `&&`, so the two flags are concatenated and the one combination
# that means "crawler asking for a crawlable path" is matched literally.
map "$lords_is_crawler$lords_crawlable" $lords_serve_shell {
    default 0;
    "11" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy the API (path prefix preserved: /api/... -> api:3000/api/...).
    # The API sets its own Cache-Control (no-store) and security headers.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The sitemap is generated from live data — it enumerates every public
    # profile — so it cannot be a static file next to robots.txt. Without this,
    # /sitemap.xml falls into the SPA fallback below and returns index.html at
    # 200 text/html, which Search Console rejects without explaining why.
    # robots.txt IS static and ships in this image; it does not belong here.
    location = /sitemap.xml {
        proxy_pass http://api:3000/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The internal endpoint the crawler rewrite lands on. `internal` means it
    # cannot be requested from outside — a client asking for /__seo/... directly
    # gets a 404 — so this is a routing target, not a second public URL that
    # could be indexed or shared.
    location /__seo/ {
        internal;
        rewrite ^/__seo(/.*)$ /api/seo$1 break;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Long-cache fingerprinted assets (content-hashed filenames → safe to cache
    # immutably). Security headers are repeated here because a location-level
    # add_header suppresses inherited server-level ones in nginx.
    #
    # Listed BEFORE the SPA fallback and matched by extension, so it is reached
    # regardless of user-agent — Discord fetches an og:image with a spoofed
    # Firefox UA rather than Discordbot, and an asset path is never crawlable
    # anyway, so no image can be diverted into the shell.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: every other route serves index.html for client-side routing.
    # index.html itself must NEVER be cached — it is the un-fingerprinted entry
    # point, and a stale copy pins the app to an old bundle (and an old CSP).
    location / {
        # A crawler on a crawlable path gets the server-rendered shell instead.
        # Every human, and every crawler on any other path, falls straight
        # through to the SPA exactly as before.
        if ($lords_serve_shell) {
            rewrite ^(.*)$ /__seo$1 last;
        }

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
