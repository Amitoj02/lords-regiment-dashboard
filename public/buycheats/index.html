<!doctype html>
<!--
    /buycheats — a rickroll (T-0313).

    It unfurls in Discord as "Holdfast Cheats & Tricks", then sends whoever
    clicks it to https://youtu.be/t179PiWXDnA. The card is the whole point: if
    the preview gives the joke away, nobody clicks and the page has failed.

    ── WHY THIS IS A STATIC FILE AND NOT AN ANGULAR ROUTE ────────────────────
    No unfurler runs JavaScript. An Angular route would hand Discordbot the
    empty app shell and index.html's DEFAULT og: tags — the card would read
    "Lords Regiment", not this — because SeoService only ever rewrites tags in a
    browser that booted the bundle.

    The site already solves that for real pages by rewriting crawler traffic to
    the API's server-rendered shells (`$lords_crawlable` in nginx.conf). That
    route is unavailable here: those shells are generated by the BACKEND repo
    from live data, so a page only this repo knows about cannot have one, and a
    path listed in that map without a matching `/api/seo/*` route returns JSON
    404 — which unfurls as a BROKEN card, strictly worse than none.

    A static document sidesteps both. angular.json copies public/ verbatim to
    the dist root, nginx's SPA fallback resolves /buycheats to this file's
    directory index, and every client — crawler or human — gets these bytes.
    No nginx change, no backend change, no coupled deploy.

    ── THE TAGS ──────────────────────────────────────────────────────────────
    og:* uses `property` and twitter:* uses `name`, same as src/index.html.
    URLs are absolute: an unfurler cannot resolve a relative one.

    `noindex` is here so Google does not rank the regiment's own domain for
    "holdfast cheats" — and because a redirect a crawler cannot see, on a page
    it can, is what Google's spam policy calls a sneaky redirect. noindex takes
    the page out of that judgement entirely. Unfurlers ignore robots directives,
    so the card is unaffected.

    ⚠️ Do NOT add `Disallow: /buycheats` to public/robots.txt to do the same
    job. Whether Discordbot honours robots.txt is contested — robots.txt says
    so itself, in the comment above its unfurler section — and a Disallow that
    is honoured takes the preview down with it. The meta tag reaches the
    search engines without touching the crawlers that matter here.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Holdfast Cheats &amp; Tricks</title>
        <meta
            name="description"
            content="Discover lesser-known tricks, exploits, useful glitches, and gameplay advantages in Holdfast. Learn what still works, how to use them, and how to avoid getting banned."
        />
        <meta name="robots" content="noindex, nofollow" />

        <meta property="og:site_name" content="Lords Regiment" />
        <meta property="og:type" content="article" />
        <meta property="og:url" content="https://lordsofholdfast.com/buycheats" />
        <meta property="og:title" content="Holdfast Cheats &amp; Tricks" />
        <meta
            property="og:description"
            content="Discover lesser-known tricks, exploits, useful glitches, and gameplay advantages in Holdfast. Learn what still works, how to use them, and how to avoid getting banned."
        />
        <!-- An in-game battle screenshot the site already ships, so the card
             carries no new asset and no new URL to keep alive. 500x280 is close
             enough to 1.91:1 that Discord crops nothing. -->
        <meta property="og:image" content="https://lordsofholdfast.com/assets/images/bg-1.jpg" />
        <meta property="og:image:width" content="500" />
        <meta property="og:image:height" content="280" />
        <meta property="og:image:alt" content="A Holdfast: Nations at War line battle" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Holdfast Cheats &amp; Tricks" />
        <meta
            name="twitter:description"
            content="Discover lesser-known tricks, exploits, useful glitches, and gameplay advantages in Holdfast. Learn what still works, how to use them, and how to avoid getting banned."
        />
        <meta name="twitter:image" content="https://lordsofholdfast.com/assets/images/bg-1.jpg" />
        <!-- Discord paints its embed's left rule in this colour. Brass, so the
             card reads as a published guide rather than as the site's chrome. -->
        <meta name="theme-color" content="#c69a45" />

        <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />

        <!-- `defer`, so the fetch starts here while the body is still parsing and
             runs the moment #continue exists. The path is ABSOLUTE on purpose:
             this document answers on both /buycheats and /buycheats/, and a
             relative "go.js" would resolve to /go.js — a 404 — on the first. -->
        <script src="/buycheats/go.js" defer></script>

        <!-- Inline, because there is no bundle here and one blocking round trip
             for a stylesheet is longer than this page is meant to exist. The
             edge CSP allows it: style-src carries 'unsafe-inline'. Tokens are
             literals for the same reason — src/styles never reaches this file. -->
        <style>
            :root {
                color-scheme: dark;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #0b0e14;
                color: #d8d2c2;
                font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
                text-align: center;
            }
            .card {
                max-width: 30rem;
            }
            .eyebrow {
                margin: 0 0 10px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: #c69a45;
            }
            h1 {
                margin: 0 0 12px;
                font-family: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
                font-size: 34px;
                font-weight: 600;
                line-height: 1.15;
                color: #efe9d8;
            }
            p {
                margin: 0 auto 22px;
                max-width: 26rem;
                font-size: 14px;
                line-height: 1.6;
                color: #aea795;
            }
            .spinner {
                width: 22px;
                height: 22px;
                margin: 0 auto 22px;
                border: 2px solid #2a3142;
                border-top-color: #c69a45;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .spinner {
                    animation: none;
                }
            }
            a {
                display: inline-block;
                padding: 9px 18px;
                border: 1px solid #8d6724;
                border-radius: 3px;
                background: #161b25;
                color: #efd9a3;
                font-size: 13px;
                font-weight: 600;
                text-decoration: none;
            }
            a:hover,
            a:focus-visible {
                background: #1b212c;
                border-color: #c69a45;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <p class="eyebrow">Holdfast: Nations at War</p>
            <h1>Cheats &amp; Tricks</h1>
            <div class="spinner"></div>
            <p>Opening the guide&hellip;</p>
            <!--
                Both halves of the redirect in one element, deliberately:
                go.js reads its destination off this href, and it is also the
                fallback a reader with JavaScript disabled clicks. Two copies of
                the URL would be two things to keep in step. It cannot live
                inside <noscript> — that content is inert text, never DOM, in
                the browsers that actually run the script.
            -->
            <a id="continue" href="https://youtu.be/t179PiWXDnA" rel="noopener nofollow"
                >Continue to the guide &rarr;</a
            >
        </main>
    </body>
</html>
