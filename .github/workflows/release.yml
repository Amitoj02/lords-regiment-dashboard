# ─────────────────────────────────────────────────────────────────────────────
# Publish the web (Angular SPA + nginx) image to GHCR.
#
# This exists so the production compose stack can reference an image instead of
# building from `context: ../lords-regiment-dashboard` — a relative path that
# works on a dev machine with both repos side by side, but not on a server.
#
# Building here rather than on the VPS also removes the real memory risk: the
# Angular CLI spawns several V8 isolates in one process, and the production box
# is a 2 vCore / 4 GB VPS already running MySQL and the API.
#
# The built bundle is host-agnostic — environment.prod.ts sets apiBaseUrl to the
# relative '/api', so one image works behind any domain.
#
# NOTE: this repo is private, so published packages are private too. The VPS
# needs `docker login ghcr.io` with a PAT carrying read:packages.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Top-level least-privilege default (LDA-M15); the build job re-grants the narrow
# packages:write it needs to publish to GHCR.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-image:
    name: Build & push lords-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner — GHCR rejects uppercase in image names.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/lords-web" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Web image published"
            echo ''
            echo '```'
            echo "${{ steps.img.outputs.name }}:${{ github.sha }}"
            echo "${{ steps.img.outputs.name }}:latest"
            echo '```'
            echo ''
            echo 'Nothing live has changed. Rolling this out is a manual step in'
            echo 'the BACKEND repo — one workflow deploys both images, because the'
            echo 'two share an API contract and must ship together:'
            echo ''
            echo '  lords-dashboard-backend → Actions → Deploy to production'
            echo ''
            echo "    web_tag = ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
