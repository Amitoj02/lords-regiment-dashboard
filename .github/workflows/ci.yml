name: CI

on:
  # Every branch, so a PR stacked on another topic branch is still checked — the
  # pull_request trigger below filters on the BASE branch and would skip it.
  push:
    branches: ['**']
  pull_request:
    # `dev` is the integration branch (main <- dev <- topic branches) and gets
    # exactly the same gate main does.
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Must track the Dockerfile's base image — testing on a different major
          # than the release build ships is how a runtime regression slips past.
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build

      - name: Unit tests (headless)
        run: npm run test:ci
